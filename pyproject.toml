[build-system]
requires = ["setuptools>=69,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "forgellm-governance"
version = "0.1.0"
description = "Machine-enforced research, task and benchmark governance for ForgeLLM"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary until the ForgeLLM owner accepts a licensing ADR"}
authors = [{name = "ForgeLLM Project"}]
dependencies = [
  "jsonschema[format]==4.26.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "pre-commit==4.3.0",
  "ruff==0.16.2",
]

[project.scripts]
forgellm-governance = "forgellm_governance.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
