schema_version: '1.0'
task_id: P0-T08
title: Build exact speculative-decoding reference semantics
phase: P0
status: in_progress
charter_goals:
- Preserve inference correctness independently of hardware optimization.
- Establish falsifiable reference semantics before runtime implementation.
- Make state ownership, commit and rollback boundaries explicit.
goal: Implement a finite exact placement-independent oracle for stochastic and greedy speculative decoding, exhaustive target-law equality and transactional token-prefix state semantics.
non_goals:
- Download, load or execute a neural model or tokenizer.
- Use floating-point logits as the exactness oracle.
- Run hardware probes, inference benchmarks or performance experiments.
- Implement the Rust runtime, C ABI, scheduler, accelerator backend, kernel or network path.
- Implement tree speculation, Medusa, EAGLE, Transition Atlas or approximate verification.
- Claim same-seed sequence identity or any performance improvement.
inputs:
- Owner authorization CA-03 / subagent-driven recorded on 2026-08-14.
- Canonical S-0006 state.
- PAP-SPECDEC and PAP-SPECSAMPLING primary sources.
- CLM-047 scoped external claim.
- CA-03 exact speculative-decoding research synthesis.
- Owner-authorized exact speculative-decoding specification and implementation plan.
outputs:
- Immutable exact finite distribution and deterministic random-tape primitives.
- One-token modified rejection-sampling kernel.
- Finite table-defined autoregressive model reference.
- Sampled speculative block-round semantics with EOS and budget handling.
- Exact ordinary-target and speculative output-law enumerators.
- Separate deterministic greedy oracle.
- Transactional target/draft/auxiliary token-prefix state witnesses.
- Canonical deterministic traces and adversarial tests.
- Fresh specification and code-quality reviews plus hosted/post-merge evidence.
