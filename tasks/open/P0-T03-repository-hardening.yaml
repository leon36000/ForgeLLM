schema_version: "1.0"
task_id: P0-T03
title: Harden and directly verify the public ForgeLLM GitHub control plane
phase: P0
status: in_progress
charter_goals:
  - Preserve canonical project state in version control.
  - Prevent unverified or privileged execution from bypassing project gates.
  - Make repository security controls directly observable.
goal: Accept the owner-selected public repository boundary, enforce public-data controls, configure the strongest available main protection, validate security workflows, and preserve machine-readable evidence without registering a self-hosted runner.
non_goals:
  - Implement inference runtime or kernel code.
  - Register a self-hosted CPU or GPU runner.
  - Install or modify GPU drivers, CUDA, ROCm, firmware, or system services.
  - Change repository visibility again without a superseding ADR.
  - Select a project license.
inputs:
  - S-0003 state and main commit 843f8127f76a0c7f2ef9863853dccaddeff90aa8.
  - Owner decision in issue 8 and ADR-0003.
  - GitHub repository leon36000/ForgeLLM.
  - Direct evidence that visibility is public, main is unprotected, and repository rulesets are empty on 2026-08-13.
  - Successful CodeQL and Phase 0 runs recorded in S-0003.
outputs:
  - Accepted public-repository/private-asset ADR and operating policy.
  - Direct evidence of main branch protection or ruleset configuration, including exact API/CLI output and limitations.
  - Read-only repository security and Actions-permission audit artifact.
  - Verified Dependency Review capability decision, including the observed Dependency Graph prerequisite.
  - Updated repository policy, security/licensing/contribution guidance, state, risks, mobile projection, review report, and handoff.
allowed_paths:
  - .github/
  - .gitignore
  - README.md
  - artifacts/governance/
  - docs/architecture/
  - docs/governance/
  - docs/reviews/
  - docs/state/
  - docs/roadmap/
  - chatgpt/mobile-core/
  - scripts/github/
  - tasks/open/
  - tasks/closed/
  - tests/
  - tools/
forbidden_actions:
  - Register or execute a self-hosted runner.
  - Weaken the Validate and test gate.
  - Grant workflow write permissions not required by a reviewed workflow.
  - Add credentials, tokens, restricted assets, hostnames, private network addresses, or stable device identifiers to Git.
  - Enable a conditionally skipped check as required.
  - Invent CODEOWNERS identities or a second human reviewer.
  - Bypass unsupported GitHub features by disabling existing safety rules.
  - Interpret a successful scanner workflow as evidence of zero alerts without inspecting results.
acceptance_criteria:
  - The repository remains public until ADR-0003 is superseded and main remains the default branch.
  - Public-data, private-asset, external-tool and no-license notices are consistent across ADR, security, contribution, repository policy, state and mobile context.
  - The exact main protection or ruleset state is captured directly; main is not described as protected while branch.protected is false and rulesets are empty.
  - Before P0-T03 completes, main rejects force pushes and deletion, requires pull requests, conversation resolution, and the stable Validate and test check.
  - GitHub Actions default workflow permissions are read-only or remain explicitly unknown after a recorded access denial.
  - CodeQL execution/upload is evidenced, and alert count/severity is directly inspected or remains explicitly unknown.
  - Dependency Review either succeeds after the owner enables Dependency Graph and the opt-in variable, or remains explicitly disabled and non-required with the failed capability probe preserved.
  - No self-hosted runner exists or is registered by this task.
  - make ci succeeds on the exact final pull-request head.
  - A fresh agent/context review report records findings and verdict.
verification_commands:
  - make ci
  - gh repo view leon36000/ForgeLLM --json nameWithOwner,visibility,defaultBranchRef
  - gh api repos/leon36000/ForgeLLM/branches/main
  - gh api repos/leon36000/ForgeLLM/branches/main/protection
  - gh api repos/leon36000/ForgeLLM/actions/permissions/workflow
  - gh api repos/leon36000/ForgeLLM/actions/permissions/selected-actions
  - gh api repos/leon36000/ForgeLLM/rulesets
  - gh api 'repos/leon36000/ForgeLLM/code-scanning/alerts?state=open&per_page=100'
  - python scripts/github/audit_repository.py --repo leon36000/ForgeLLM --expected-visibility public --output artifacts/governance/github-audit-s0004.json --strict
  - python scripts/github/apply_branch_protection.py --repo leon36000/ForgeLLM --human-approvals 0
evidence_requirements:
  - Preserve redacted command output, timestamps, repository identity, exact commits, workflow run IDs, job IDs, and API status codes.
  - Distinguish unsupported, inaccessible, disabled, skipped, enabled, executed, uploaded, processed, passing, clean, failed and unknown states.
  - Record every repository-admin write and its rollback command.
  - Preserve a fresh-context review report and owner disposition.
  - Preserve issue 8 and ADR-0003 as the authority for public visibility.
  - Preserve Dependency Review run 31681032967 and job 94386280488 as a failed capability probe caused by disabled Dependency Graph, not a dependency finding.
  - Keep branch protection as an explicit blocker until direct evidence reports protected=true or an enforced ruleset.
dependencies:
  - P0-T02
owner_role: Project owner and repository administrator
reviewer_role: Independent agent or fresh review context; external human review before privileged runner activation
risk_ids:
  - R-005
  - R-006
  - R-007
  - R-013
  - R-014
  - R-015
claim_ids:
  - CLM-010
