forbidden_actions:
- Change any Sonar or GitHub analysis setting before the semantic RED-to-GREEN governance validator, trusted configuration, token identity/lifecycle review, prepared-inactive scanner review, and explicit activation gate required by accepted ADR-0004.
- Switch to CI-based analysis as a workaround for the LOC subscription limit; the service-level entitlement applies regardless of scanner execution location.
- Add source exclusions merely to reduce subscription LOC or obtain a green check; no justified generated/vendor/build production source has been identified.
- Delete a Sonar project, change another project visibility, change ForgeLLM visibility again, migrate subscription plan, or increase LOC entitlement without explicit owner approval appropriate to the destructive, confidentiality, or financial consequence.
- Run automatic analysis and a CI scanner against the same Sonar project concurrently.
- Print, log, commit, or transmit SONAR_TOKEN outside the approved GitHub secret boundary.
- Expose SONAR_TOKEN at workflow/job/container/service scope; deliver it to same-repository or fork pull_request execution; forward it through reusable workflows, explicit secret mappings or secrets-inherit semantics; propagate it through outputs/state; expose it to checkout/source/report acquisition/extraction/normalization/validation; expose it to reusable/composite/local actions or repository-local scripts; expose it to any non-scanner step, action pre/post hook not covered by the reviewed scanner action, or token-bearing post-processing. The current implementation permits only final approved scanner-step injection.
- Check out contributor-originated source in the eventual scanner job, execute repository-local/contributor-controlled code there, or use repository-local/composite/reusable action metadata in the final token-bearing scanner step. Source/reports must enter only as validated data through a separately reviewed secretless transfer boundary, and the final scanner action/invocation including pre/main/post behavior must be immutable-pinned and reviewed.
- Use workflow_run or pull_request_target for Sonar in the current implementation. Any future privileged PR bridge trigger requires a separate reviewed design update before it is authorized.
- Use an unpinned third-party GitHub Action.
- Grant write permissions when read-only permissions satisfy the documented scanner requirement.
- Treat an absent, skipped, cancelled, or annotation-free Sonar check as success.
- Hide baseline debt or accept an issue without a reviewed disposition.
- Weaken Phase 0, CodeQL, GitGuardian, dependency policy, branch protection, or P0-T08 exactness gates.
- Manually edit generated mobile-context projections; regenerate them only through the repository-sanctioned generation path after canonical source updates.
acceptance_criteria:
- Authenticated/anonymously reproducible readback records the Sonar project binding, visibility before/after, analysis method, observed last method, failed main task status, quality gate, new-code definition, relevant scope/issue-ignore settings, current plan/LOC entitlement, organization LOC consumption, and ForgeLLM LOC/visibility sufficient to verify the selected subscription/usage remedy.
- The failure is classified as configuration, binding or permission, source detection, platform limitation, transient service failure, or unknown due to unavailable evidence; the current observed class is platform_limitation / subscription_loc_limit_exceeded with internal branch task status FAILED.
- "The diagnosed LOC blocker is demonstrably resolved by an evidence-supported owner-approved remediation with before/after state recorded; post-remediation organization private LOC is below entitlement, maintained code is not hidden, and no restricted asset is exposed."
- Accepted ADR-0004 is the operative decision selecting exactly ci_based_only; the earlier proposed checkpoint remains historical, and Task 4A automatic_only is rejected/inactive unless a later accepted ADR supersedes ADR-0004.
- Before scanner workflow or properties configuration is added, an executable semantic governance test/validator is demonstrated RED against unsafe fixtures and GREEN against safe fixtures. It rejects method overlap; activation before disabled Automatic Analysis readback; same-repository/fork pull_request secret delivery; pull_request_target; workflow_run; workflow/job/container/service secret scope; reusable-workflow secret forwarding and secrets-inherit semantics; token propagation through outputs/state; reusable/composite/local actions receiving the token; repository-local scripts/actions in the final scanner step; contributor-source checkout in the eventual scanner job; unreviewed scanner/action pre/post hooks or token-bearing post execution; token-bearing contributor-code execution; automatic Clippy in the token-bearing scanner; untrusted scanner configuration/report paths; unbounded bridge data; and mutable or unverified scanner supply-chain inputs.
- Task 4B first prepares a default-off, inactive token-bearing scanner path limited to protected trusted refs. Contributor-source checkout and source/report preparation occur in a separate secretless boundary; the eventual scanner job never checks out contributor-originated source or executes repository-local/contributor-controlled code. It uses trusted workflow and connection/project configuration, cannot submit while inactive, disables automatic Clippy, and the final scanner step uses only an immutable reviewed external scanner action/invocation whose complete pre/main/post behavior is reviewed.
- Any pull-request trusted-data bridge is a separate implementation and review unit and is blocked until a separate design is accepted. The current implementation forbids workflow_run and pull_request_target. A future bridge must immutably bind repository, trusted producer workflow and immutable workflow SHA, event, run ID/attempt, PR number/head SHA, artifact ID/name and producer commit; verify an independently recorded digest before consumption; extract secretlessly into an empty isolated directory; reject duplicate names, absolute/escaping paths, symlinks, hardlinks, special files, compression bombs and explicit count/size-limit violations; allowlist exact files/types/encodings/schemas; and inject SONAR_TOKEN only into the final scanner step. Until that proof exists, defer Sonar to a protected trusted ref and keep P0-T09 open rather than treating an absent/skipped PR check as success.
- Token identity, issuer/owner, minimum scope, storage boundary, rotation, revocation, expiry, auditability, and incident response receive explicit security review before provisioning or activation; no token value or private administrative payload is recorded. SONAR_TOKEN is injected only into the final approved scanner step after all source/report acquisition/extraction/normalization/validation completes secretlessly. Workflow/job/container/service scope, direct PR secret delivery, reusable-workflow forwarding or secrets-inherit semantics, outputs/state propagation, non-scanner steps, repository-local/composite/reusable actions, unreviewed action hooks and token-bearing post-processing are forbidden.
- Scanner supply-chain evidence distinguishes immutable GitHub Action commit SHA pins from the scanner binary version and its GPG/signature verification. The exact scanner archive digest remains an explicit open limitation unless independently proven and recorded; it is never implied by an action SHA or version string.
- "The no-overlap activation sequence is evidenced in order: Automatic Analysis enabled readback, disable action, Automatic Analysis disabled readback, and only then CI scanner activation/first submission. A prepared workflow remains default-off and incapable of submission until that sequence completes."
- Any CI scanner action is pinned to an immutable full commit SHA and uses least-privilege workflow permissions; the scanner binary version and GPG/signature verification are separately pinned and recorded.
- No credential or private administrative payload is committed, and secret scanning remains green.
- Phase 0, CodeQL, GitGuardian, and the selected Sonar pull-request analysis succeed on the exact final head.
- The resulting protected main commit has a completed Sonar check with conclusion success, not cancelled, skipped, absent, or inferred.
- A second controlled pull-request and main cycle succeeds when the original failure is classified transient.
- A fresh configuration and security review records ACCEPT after every BLOCKER or MAJOR finding is resolved.
- The closeout evidence states all remaining baseline debt and does not claim repository-wide zero issues unless directly proven.
verification_commands:
- python scripts/validate_task_packet.py tasks/open/P0-T09-sonarqube-main-analysis.yaml --root .
- python -c "import yaml; yaml.safe_load(open('tasks/open/P0-T09-sonarqube-main-analysis.yaml', encoding='utf-8'))"
- Run the semantic Sonar governance validator test RED against unsafe fixtures before scanner configuration, then GREEN against safe fixtures and the prepared inactive configuration.
- make ci
- git grep -n -E 'pull_request_target|SONAR_TOKEN|sonar\.projectKey|sonar\.scm\.revision|sonarcloud|sonarqube|sonar\.rust\.clippy' -- . ':!docs/quality/*' ':!tasks/*'
- git diff -- tasks/open/P0-T09-sonarqube-main-analysis.yaml docs/superpowers/plans/2026-08-14-sonarqube-main-analysis.md
- git diff --check
- git status --short
evidence_requirements:
- Record owner authorization, canonical base, implementation head, merge commit, and selected analysis method.
- Preserve exact GitHub check and workflow identifiers for the failing baseline, final pull request, and final main commit, and distinguish GitHub check-run conclusions from internal Sonar background-task status.
- Preserve sanitized Sonar binding, visibility before/after, method, task, quality-gate, new-code, scope/issue-ignore, Billing & usage, exact LOC entitlement/consumption, and ForgeLLM LOC/visibility readback or hashes of non-public administrative evidence.
- Record every configuration change before and after, including Sonar UI changes not represented in Git.
- Record the immutable scanner action SHA separately from scanner binary version and GPG/signature verification, plus the reviewed scanner action/invocation pre/main/post behavior, effective caller/callee workflow permissions and secret mappings, absence of workflow/job/container/service and secrets-inherit propagation, secret name, and reviewed token identity/lifecycle without exposing the token value; record the exact archive digest only if proven, otherwise preserve it as an explicit open limitation.
- Record the ordered Automatic Analysis enabled readback, disable action, disabled readback, and subsequent CI activation/first-submission evidence so non-overlap is directly auditable.
- Record the prepared-inactive protected-ref scanner path and any separately reviewed trusted-data PR bridge as distinct trust boundaries. For any future bridge, record immutable producer/run/PR/artifact binding, digest, exact schemas/types/encodings, count and size limits, isolated extraction rules, fixed paths, provenance, rejection behavior, and proof that acquisition/validation/extraction are secretless before final scanner-step token injection.
- Record every Sonar finding and its fix or reviewed disposition; suppression is not an implicit disposition.
- Record complete Phase 0, CodeQL, GitGuardian, Dependency Review, and Sonar outcomes.
- Record the delegated method-selection authorization, ADR-0004 review disposition, and exact selected method before implementation.
- Close issue #26 only after reproducible successful pull-request and main analyses.
- Preserve P0-T04 and P0-T05 without modification.
