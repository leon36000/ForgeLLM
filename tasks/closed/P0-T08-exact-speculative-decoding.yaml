forbidden_actions:
- Use float or Decimal for governed exact probability calculations.
- Accept a proposal token with zero probability under its recorded q distribution.
- Verify a proposal with a q distribution different from the one used to generate it.
- Accept or commit any proposal after the first rejected position.
- Sample a correction from a zero-mass residual.
- Emit a bonus after EOS or after exhausting the output budget.
- Commit rejected proposal or suffix state.
- Mutate the original decoder state on cancellation or validation failure.
- Treat same-seed sequence identity as the stochastic exactness oracle.
- Access hardware, models, tokenizers, runtime, accelerator or network services.
- Publish a speedup, latency, quality or production-readiness claim.
acceptance_criteria:
- ExactDistribution rejects invalid tokens/weights, normalizes exactly, orders support canonically and uses deterministic tie-breaking.
- RandomTape rejects exhaustion and invalid draws; deterministic choices consume no draw.
- The one-token modified rejection law equals the target distribution exactly for adversarial finite p/q pairs.
- Sampled block rounds enforce consecutive acceptance, first-rejection correction, legal bonus, EOS and budget invariants.
- Exact ordinary-target and speculative laws are equal for every required finite model, budget 0-4 and draft length 1-3.
- Sharply different valid draft distributions preserve the same final target law.
- Greedy speculative output equals ordinary target greedy output with smallest-token tie-breaking.
- Transactional state tests prove accepted-prefix commit, rejected-suffix discard, pending correction/bonus, synchronization and exact cancellation rollback.
- Canonical traces are deterministic and serialize rational values without floats, timestamps, hosts or random IDs.
- All adversarial invalid inputs and inconsistent states fail closed with stable exception classes.
- All P0-T08-owned Python source and test files pass Ruff format verification without changing pre-existing files outside the task packet.
- The focused CA-03 suite and complete make ci pass on the exact final implementation and remediation heads.
- Fresh specification-compliance and code-quality reviews record ACCEPT after all BLOCKER/MAJOR findings are resolved.
- SonarQube Cloud reports no new issue on the final remediation PR head.
- Hosted Phase 0 and CodeQL succeeded before and after both implementation and remediation merges.
