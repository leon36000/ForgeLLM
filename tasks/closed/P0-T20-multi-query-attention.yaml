forbidden_actions:
  - Add a dependency, model, runtime, backend, ABI, GPU kernel, CUDA/ROCm path, serving path, or hardware probe.
  - Add or modify any file under artifacts/governance/loop-engineering/.
  - Change existing primitive semantics, silently flatten query rows, normalize across rows, or apply an implicit causal mask.
  - Read, print, copy, validate, provision, rotate, or transmit any secret value; SONAR_TOKEN remains name-only/readiness evidence.
  - Modify external SonarQube, GitHub, repository settings, protected-branch rules, secrets, or workflow activation.
  - Use a model inference service, LiteLLM, an external validation trio, or external model output as repository evidence.
  - Use an intermediate Python float to round high-precision oracle values to f32; preserve the existing direct Fraction-to-f32 path.
  - Claim real-model, PyTorch, JAX, hardware, accelerator, performance, production, or phase-exit evidence.
acceptance_criteria:
  - attention_decode_multi_query accepts finite rank-two queries, keys, and values with shapes [query_count, head_dim], [context_len, head_dim], and [context_len, head_dim], and returns [query_count, head_dim].
  - Every query row receives its own scaled score row and its own softmax normalization; no probability or denominator is shared between query rows.
  - The implementation composes the existing checked matmul, transpose, and softmax primitives without changing their numerical behavior or signatures, and preserves fixed row-major order and recoverable allocation errors.
  - Rank, dimension, context-length, non-finite-input, non-finite-result, and allocation failures remain typed and fail closed through the existing ReferenceError contract.
  - The stdlib-only oracle re-derives the same f64-accumulate, f32-cast, f64 scale, per-row softmax, and final f64-accumulate sequence; returned tolerances are per output element and per query row, with the derivation documented rather than guessed. Fixture generation reconstructs actual f32 operands, records every sequential binary64 partial sum for both matmul folds, and fails closed for non-dyadic or otherwise non-exact finite-binary64 intermediates.
  - Permanent Rust and Python tests include an independent row-wise oracle, unequal-row attention behavior, context_len=1 exactness, malformed/rank/dimension/non-finite paths, randomized bounded inputs, and a near-rounding-boundary regression.
  - The deterministic fixture generator, committed fixture hash, restricted Rust reader, and fixture dispatch cover at least two multi-query cases and pass their exact checks without a new dependency.
  - "`cargo fmt --all --check`, `cargo clippy --workspace --all-targets --locked -- -D warnings`, `cargo test --workspace --all-targets --locked`, `PYTHONPATH=src python3 -m pytest -q tests/test_reference_oracle.py`, fixture/hash checks, packet validation, lifecycle/state validation, `make ci`, and `git diff --check` pass on the exact candidate head."
  - State ID, canonical protected-main source anchor, README task map, roadmap, handoff, mobile projection, derived manifest, and exact TREE are synchronized in the same bounded change; no governance receipt/declaration file changes.
  - Independent Luna correctness review and the single critical Sol gate record ACCEPT with no unresolved blocker before publication/merge; hosted required checks pass for the exact PR head before merge.
  - The final report calls this a bounded CPU-only reference increment and explicitly leaves causal masking, full self-attention policy, multi-head/RoPE, KV cache, runtime/backend integration, model conformance, hardware, and performance unestablished.
