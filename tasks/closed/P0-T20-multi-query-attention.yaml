schema_version: "1.0"
task_id: P0-T20
title: Add bounded multi-query attention to the Rust reference core
phase: P0
status: complete
charter_goals:
  - Correction and reproducibility precede performance.
  - Reference CPU execution path.
goal: Add a bounded CPU multi-query scaled dot-product attention primitive with independent row-wise softmax, a stdlib-only differential oracle, and synchronized state projections, while preserving the existing single-query and primitive contracts.
non_goals:
  - Implement a causal mask, full self-attention policy, multi-head reshape or split, RoPE, ALiBi, or any positional encoding.
  - Implement KV-cache append, eviction, capacity management, paging, scheduling, batching policy, or runtime integration.
  - Modify the numerical behavior or public contract of matmul, softmax, transpose, RMSNorm, embedding_gather, reshape, argmax, dense_decode_single_token, or attention_decode_single_query.
  - Add PyTorch, NumPy, serde_json, or any other third-party dependency to the Rust or Python runtime surfaces.
  - Claim PyTorch, JAX, real-model, hardware, accelerator, benchmark, production-readiness, Phase 1, or Phase 2 conformance.
  - Modify SonarQube, GitHub settings, credentials, workflows, hardware state, model artifacts, or the Loop Engineering declaration/receipt catalog.
inputs:
  - "Protected main base cc5a90d0190bf84e3124a7e81bbe52bc7d0820bc, which contains the completed P0-T19 single-query attention increment."
  - "P0-T19's closed packet and specification, whose non-goal explicitly defers multi-query attention to P0-T20."
  - "The existing checked Tensor, matmul, transpose, softmax, and allocation helpers in crates/forgellm-reference."
  - "The P0-T18/P0-T19 stdlib-only Fraction/Decimal oracle and fixture harness."
  - "The project charter, architecture principles, lifecycle validator, and generated mobile-state manifest contract."
outputs:
  - "crates/forgellm-reference/src/lib.rs: attention_decode_multi_query(queries, keys, values) returning [query_count, head_dim]."
  - "crates/forgellm-reference/tests/multi_query_attention.rs: independent row-wise Rust oracle tests and typed failure-path tests."
  - "src/forgellm_governance/reference_oracle.py and tests/test_reference_oracle.py: multi_query_attention_oracle with per-query context tolerances and adversarial/property coverage."
  - "scripts/generate_reference_oracle_fixture.py, the pinned JSON fixture, and the dependency-free Rust fixture dispatch extended for multi-query cases."
  - "A P0-T20 specification, execution plan, quality report, independent review receipt, closed task packet, and synchronized state/roadmap/mobile projections."
allowed_paths:
  - crates/forgellm-reference/src/lib.rs
  - crates/forgellm-reference/tests/
  - src/forgellm_governance/reference_oracle.py
  - scripts/generate_reference_oracle_fixture.py
  - crates/forgellm-reference/tests/fixtures/reference_ops_oracle.json
  - crates/forgellm-reference/tests/fixtures/reference_ops_oracle.sha256
  - tests/test_reference_oracle.py
  - docs/superpowers/specs/2026-08-29-p0-t20-multi-query-attention-design.md
  - docs/superpowers/plans/2026-08-29-p0-t20-multi-query-attention.md
  - docs/quality/P0-T20-MULTI-QUERY-ATTENTION.md
  - docs/reviews/P0-T20-MULTI-QUERY-ATTENTION.md
  - tasks/open/P0-T20-multi-query-attention.yaml
  - tasks/closed/P0-T20-multi-query-attention.yaml
  - docs/state/CURRENT_STATE.md
  - docs/state/HANDOFF.md
