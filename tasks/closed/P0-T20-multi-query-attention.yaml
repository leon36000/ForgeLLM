  - python3 scripts/generate_reference_oracle_fixture.py --check --root .
  - sha256sum -c crates/forgellm-reference/tests/fixtures/reference_ops_oracle.sha256
  - cargo fmt --all --check
  - cargo clippy --workspace --all-targets --locked -- -D warnings
  - cargo test --workspace --all-targets --locked
  - PYTHONPATH=src python3 scripts/validate_task_packet.py tasks/closed/P0-T20-multi-query-attention.yaml --root .
  - PYTHONPATH=src python3 scripts/validate_project_state.py --root .
  - make ci
  - git diff --check
