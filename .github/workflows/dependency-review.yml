name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: ${{ vars.FORGELLM_ENABLE_DEPENDENCY_REVIEW == 'true' && github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency graph changes
        uses: actions/dependency-review-action@2f920dad77d7f4f2ea876b66287b896de40dda79 # 2026-07 security-updated snapshot
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
