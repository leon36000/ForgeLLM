name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: ${{ (github.event.repository.visibility == 'public' || vars.FORGELLM_ENABLE_DEPENDENCY_REVIEW == 'true') && github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency graph changes
        uses: actions/dependency-review-action@1e966ba708e4b64bb0c9bfb7abb5a232840be16a # 2026-07 security-updated snapshot
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
