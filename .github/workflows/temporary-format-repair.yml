name: Temporary trusted format repair

on:
  push:
    branches:
      - agent/p0-t02-initialize-repository

permissions:
  contents: write

concurrency:
  group: temporary-format-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'leon36000/ForgeLLM' &&
      github.actor == 'leon36000' &&
      github.event.head_commit.message == 'chore(ci): add temporary formatter repair'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the trusted task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/p0-t02-initialize-repository
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: '3.11'

      - name: Install the pinned formatter
        run: python -m pip install ruff==0.16.2

      - name: Apply and verify the exact Ruff repair
        run: |
          python -m ruff check src/forgellm_governance/validation.py --fix
          python -m ruff check src/forgellm_governance/validation.py
          python -m compileall -q src/forgellm_governance/validation.py

      - name: Update the validation source hash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          source = Path('src/forgellm_governance/validation.py')
          manifest = Path('MANIFEST.sha256')
          digest = sha256(source.read_bytes()).hexdigest()
          suffix = '  src/forgellm_governance/validation.py'
          lines = manifest.read_text(encoding='utf-8').splitlines()
          matches = [index for index, line in enumerate(lines) if line.endswith(suffix)]
          if len(matches) != 1:
              raise SystemExit(f'expected one manifest entry for {source}, found {len(matches)}')
          lines[matches[0]] = f'{digest}{suffix}'
          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          sha256sum -c MANIFEST.sha256

      - name: Remove the temporary privileged workflow
        run: rm .github/workflows/temporary-format-repair.yml

      - name: Commit the bounded repair
        run: |
          git config user.name 'ForgeLLM CI Repair'
          git config user.email '216249790+leon36000@users.noreply.github.com'
          git add src/forgellm_governance/validation.py MANIFEST.sha256 .github/workflows/temporary-format-repair.yml
          git diff --cached --check
          git commit -m 'fix(ci): apply Ruff formatting safely'
          git push origin HEAD:agent/p0-t02-initialize-repository
