name: Temporary refresh mobile context hash

on:
  push:
    branches:
      - agent/p0-t02-closeout-s0003

permissions:
  contents: write

concurrency:
  group: temporary-refresh-mobile-hash
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.repository == 'leon36000/ForgeLLM' &&
      github.event.repository.private == true &&
      github.event.head_commit.message == 'chore(ci): refresh S-0003 mobile hash manifest'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out closeout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/p0-t02-closeout-s0003
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: '3.11'
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install -e '.[dev]'

      - name: Regenerate and verify mobile context hashes
        run: |
          set -euo pipefail
          python scripts/hash_mobile_context.py --root . --write
          make ci
          git diff --check

      - name: Remove temporary workflow and commit result
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-refresh-mobile-hash.yml
          git config user.name 'ForgeLLM CI Apply'
          git config user.email '216249790+leon36000@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(ci): record S-0003 mobile hash'
          git push origin HEAD:agent/p0-t02-closeout-s0003
