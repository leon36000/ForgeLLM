name: Temporary verify P0-T03 ruleset CLI

on:
  push:
    branches:
      - agent/p0-t03-main-ruleset-cli

permissions:
  contents: write

concurrency:
  group: temporary-verify-p0-t03-ruleset-cli
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'leon36000/ForgeLLM' &&
      github.event.repository.private == true &&
      github.event.head_commit.message == 'chore(ci): verify P0-T03 ruleset CLI'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out stacked task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/p0-t03-main-ruleset-cli
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: '3.11'
          cache: pip

      - name: Install locked Phase 0 dependencies
        run: python -m pip install -e '.[dev]'

      - name: Refresh stable manifest entries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          manifest = Path('MANIFEST.sha256')
          entries: dict[str, str] = {}
          for line in manifest.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              digest, relative = line.split('  ', 1)
              entries[relative] = digest

          for relative in (
              'scripts/github/apply_main_ruleset.py',
              'src/forgellm_governance/github_ruleset.py',
              'tests/test_github_ruleset.py',
          ):
              entries[relative] = hashlib.sha256(Path(relative).read_bytes()).hexdigest()

          manifest.write_text(
              ''.join(f'{entries[path]}  {path}\n' for path in sorted(entries)),
              encoding='utf-8',
          )
          PY

      - name: Run complete verification gate
        run: |
          set -euo pipefail
          make ci
          sha256sum -c MANIFEST.sha256
          python scripts/github/apply_main_ruleset.py \
            --repo leon36000/ForgeLLM \
            --payload tasks/open/P0-T03-main-ruleset-payload.json
          git diff --check

      - name: Remove temporary workflow and commit verified result
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-verify-ruleset-cli.yml
          git config user.name 'ForgeLLM CI Apply'
          git config user.email '216249790+leon36000@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(governance): verify safe main ruleset CLI'
          git push origin HEAD:agent/p0-t03-main-ruleset-cli
