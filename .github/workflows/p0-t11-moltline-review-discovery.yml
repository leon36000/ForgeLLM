name: P0-T11 external code-quality evidence

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p0-t11-moltline-review-discovery.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Review exact public P0-T11 candidate with anonymous MCP tools
        env:
          GH_TOKEN: ${{ github.token }}
          MOLTLINE_ENDPOINT: https://mcp.moltlinestudio.com/codereview
          EXPECTED_BASE: aff9897e1c9e3aaebd67889eb9ff6d65a1710694
          EXPECTED_HEAD: be155b9ec475a208674ab7cab6ef95d6c775c6e5
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          endpoint = os.environ["MOLTLINE_ENDPOINT"]
          repository = "leon36000/ForgeLLM"
          expected_base = os.environ["EXPECTED_BASE"]
          expected_head = os.environ["EXPECTED_HEAD"]
          gh_token = os.environ["GH_TOKEN"]

          def parse_body(content_type: str, body: str):
              if not body.strip():
                  return {}
              if "application/json" in content_type:
                  return json.loads(body)
              events = []
              current = []
              for line in body.splitlines():
                  if line.startswith("data:"):
                      current.append(line[5:].lstrip())
                  elif not line and current:
                      events.append(json.loads("\n".join(current)))
                      current = []
              if current:
                  events.append(json.loads("\n".join(current)))
              if not events:
                  raise RuntimeError("MCP response contained neither JSON nor SSE data events")
              return events[-1]

          def mcp_post(payload, session_id=None):
              headers = {
                  "Accept": "application/json, text/event-stream",
                  "Content-Type": "application/json",
              }
              if session_id:
                  headers["Mcp-Session-Id"] = session_id
                  headers["MCP-Protocol-Version"] = "2025-06-18"
              request = urllib.request.Request(
                  endpoint,
                  data=json.dumps(payload).encode("utf-8"),
                  headers=headers,
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read().decode("utf-8")
                  return parse_body(response.headers.get("Content-Type", ""), body), response.headers.get("Mcp-Session-Id")

          def github_get(url: str, accept: str = "application/vnd.github+json") -> str:
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": accept,
                      "Authorization": f"Bearer {gh_token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read().decode("utf-8")

          metadata = json.loads(github_get(f"https://api.github.com/repos/{repository}/pulls/48"))
          observed_base = metadata.get("base", {}).get("sha")
          observed_head = metadata.get("head", {}).get("sha")
          if observed_base != expected_base or observed_head != expected_head:
              raise RuntimeError(
                  f"P0-T11 review target moved: base={observed_base} head={observed_head}"
              )

          diff = github_get(
              f"https://api.github.com/repos/{repository}/pulls/48",
              "application/vnd.github.v3.diff",
          )
          if not diff.startswith("diff --git "):
              raise RuntimeError("GitHub did not return a unified PR diff")
          if len(diff.encode("utf-8")) > 250_000:
              raise RuntimeError("review diff exceeds the bounded evidence budget")

          lib_code = github_get(
              f"https://raw.githubusercontent.com/{repository}/{expected_head}/crates/forgellm-reference/src/lib.rs",
              "text/plain",
          )

          initialized, session_id = mcp_post(
              {
                  "jsonrpc": "2.0",
                  "id": 1,
                  "method": "initialize",
                  "params": {
                      "protocolVersion": "2025-06-18",
                      "capabilities": {},
                      "clientInfo": {"name": "forgellm-independent-review", "version": "1.0"},
                  },
              }
          )
          if "error" in initialized or not session_id:
              raise RuntimeError("Moltline MCP initialization failed")
          mcp_post(
              {"jsonrpc": "2.0", "method": "notifications/initialized", "params": {}},
              session_id,
          )

          next_id = 10
          def call_tool(name: str, arguments: dict):
              global next_id
              payload, _ = mcp_post(
                  {
                      "jsonrpc": "2.0",
                      "id": next_id,
                      "method": "tools/call",
                      "params": {"name": name, "arguments": arguments},
                  },
                  session_id,
              )
              next_id += 1
              if "error" in payload:
                  raise RuntimeError(f"Moltline tool {name} protocol error: {payload['error']}")
              return payload.get("result", {})

          results = {
              "target": {"base": observed_base, "head": observed_head},
              "server": initialized.get("result", {}).get("serverInfo"),
              "review_diff": call_tool("review_diff", {"diff": diff}),
              "secret_scan": call_tool("secret_scan", {"text": diff}),
              "ai_code_smell_scan": call_tool("ai_code_smell_scan", {"code": lib_code}),
              "complexity_report": call_tool("complexity_report", {"code": lib_code, "language": "rust"}),
          }
          print(json.dumps(results, indent=2, sort_keys=True))
          PY
