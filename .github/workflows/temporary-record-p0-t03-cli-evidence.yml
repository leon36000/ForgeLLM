name: Temporary record P0-T03 CLI evidence

on:
  push:
    branches:
      - agent/p0-t03-main-ruleset-cli

permissions:
  contents: write

concurrency:
  group: temporary-record-p0-t03-cli-evidence
  cancel-in-progress: false

jobs:
  verify-and-record:
    if: >-
      github.repository == 'leon36000/ForgeLLM' &&
      github.event.repository.private == true &&
      github.event.head_commit.message == 'chore(ci): record P0-T03 CLI evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out stacked task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/p0-t03-main-ruleset-cli
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: '3.11'
          cache: pip

      - name: Install locked Phase 0 dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run exact-source verification
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/temporary-verify-ruleset-cli.yml
          make ci | tee /tmp/p0-t03-ci.log
          sha256sum -c MANIFEST.sha256
          python scripts/github/apply_main_ruleset.py \
            --repo leon36000/ForgeLLM \
            --payload tasks/open/P0-T03-main-ruleset-payload.json \
            | tee /tmp/p0-t03-dry-run.log
          git diff --check

      - name: Record automated evidence without granting a verdict
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_NAME: verify-and-record
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path

          path = Path('docs/governance/reviews/P0-T03-ruleset-cli-review.md')
          text = path.read_text(encoding='utf-8')
          marker = '## Verifier context\n'
          evidence = f'''## Automated evidence\n\n- **Source head:** `{os.environ["SOURCE_SHA"]}`\n- **Workflow run:** `{os.environ["RUN_ID"]}`\n- **Job:** `{os.environ["JOB_NAME"]}`\n- **Ruff and complete `make ci`:** `PASS`\n- **Stable manifest verification:** `PASS`\n- **Ruleset CLI dry-run:** `PASS`\n- **Previous temporary verifier absent:** `PASS`\n- **Administrative write performed:** `false`\n\n'''
          if '## Automated evidence\n' in text:
              start = text.index('## Automated evidence\n')
              end = text.index(marker, start)
              text = text[:start] + evidence + text[end:]
          else:
              text = text.replace(marker, evidence + marker)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit evidence
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-record-p0-t03-cli-evidence.yml
          git config user.name 'ForgeLLM CI Evidence'
          git config user.email '216249790+leon36000@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(ci): persist P0-T03 CLI evidence'
          git push origin HEAD:agent/p0-t03-main-ruleset-cli
