name: Phase 0 verification

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 release snapshot
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@751276eafca55f10f252026015f43c488f2322ba # security-fixed 2026-08 snapshot
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked Phase 0 dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run complete Phase 0 gate
        run: make ci
      - name: Dry-run core bootstrap
        run: scripts/bootstrap_core_ubuntu.sh --dry-run
