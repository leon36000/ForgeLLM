name: Trusted GPU inventory

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-gpu-inventory
  cancel-in-progress: false

jobs:
  inventory:
    name: Redacted inventory on trusted lab runner
    if: github.event.repository.private == true && github.ref_protected == true
    environment: gpu-lab
    runs-on: [self-hosted, linux, x64, forgellm-gpu]
    timeout-minutes: 15
    steps:
      - name: Check out protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 release snapshot
        with:
          persist-credentials: false
      - name: Create isolated Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -e .
      - name: Validate before probing
        run: PYTHONPATH=src .venv/bin/python scripts/validate_project_state.py --root .
      - name: Collect redacted inventory
        run: PYTHONPATH=src .venv/bin/python scripts/hardware_inventory.py --output artifacts/hardware-trusted.json
      - name: Hash inventory
        run: sha256sum artifacts/hardware-trusted.json > artifacts/hardware-trusted.sha256
      - name: Upload short-lived evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 development snapshot, reviewed 2026-08
        with:
          name: forgellm-hardware-inventory-${{ github.run_id }}
          path: |
            artifacts/hardware-trusted.json
            artifacts/hardware-trusted.sha256
          retention-days: 7
          if-no-files-found: error
